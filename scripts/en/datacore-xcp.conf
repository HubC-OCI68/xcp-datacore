# datacore-xcp.conf - variables for the DataCore SANsymphony deployment on an XCP-ng 8.3 pool
# Bash syntax, loaded by datacore-xcp.sh (same folder, or path in $DATACORE_XCP_CONF).
# Identical file on both hosts: after any change, './datacore-xcp.sh sync'.
# Do not remove the 'declare -A' statements (associative arrays).

# ---------------------------------------------------------------- Pool
HOSTS=([1]="xcp-01" [2]="xcp-02")             # XAPI name-label of the hosts (xe host-list); node 1 = master at installation (may change after an HA failover)
DC_VMS=([1]="DC-01" [2]="DC-02")              # SANsymphony VMs to create

# ---------------------------------------------------------------- Network
# Physical NIC (XCP device) per function: pick with './datacore-xcp.sh nics' (values below = example).
# 4 distinct NICs, present under the same name on both hosts, excluding management.
declare -A NIC=([DC-FE1]=eth0 [DC-FE2]=eth1 [DC-MR1]=eth2 [DC-MR2]=eth3)
MGMT_NET="mgmt"                               # name-label of the pool management network (xe network-list)
# Network of the management VIF of the DataCore VMs (VIF 0). Empty = MGMT_NET.
# Recommended: a network that does not depend on the single management link of the hosts (section 2).
DC_MGMT_NET=""
# First 3 octets of each storage network (/24, not routed, no gateway)
declare -A SUBNET=([DC-FE1]=10.200.11 [DC-FE2]=10.200.12 [DC-MR1]=10.200.21 [DC-MR2]=10.200.22)
HOST_OCT=([1]=11 [2]=12)                      # last octet of the dom0s on FE1/FE2
DC_OCT=([1]=21 [2]=22)                        # last octet of the DataCore VMs on FE and MR
MTU=9000                                      # MTU of the 4 storage networks, identical end to end

# ---------------------------------------------------------------- iSCSI
# dom0 IQNs, suggested by 'host N' (can be changed at the prompt). Set them BEFORE 'iscsi' and the DMC.
# Format: iqn.YYYY-MM.reversed.domain[:name], lowercase.
# Suggestion: HOST_IQN[N] if set, otherwise IQN_PREFIX:host-name, otherwise the current IQN.
IQN_PREFIX=""                                 # e.g. "iqn.2026-09.lan.example"
HOST_IQN=([1]="" [2]="")

# ---------------------------------------------------------------- NTP
NTP_SERVERS=()                                # MANDATORY, e.g. ("ntp1.example.lan" "ntp2.example.lan"); align with the PDC emulator

# ---------------------------------------------------------------- Passthrough
# BDF of the SAS HBA of each host: 'lspci -nn | grep -iE "sas|raid"' on EACH host
PCI_BDF=([1]="0000:00:00.0" [2]="0000:00:00.0")

# ---------------------------------------------------------------- DataCore VM
DC_VCPU=10                                    # DataCore: 4 + 3 per pair of iSCSI ports (FE, MR) = 10; +1 for performance recording
DC_RAM_GIB=32
DC_DISK_GIB=100
LOCAL_SR=([1]="" [2]="")                      # UUID of the local SR holding the VM; empty = auto-detection
DC_VCPU_MASK=([1]="" [2]="")                  # optional: CPUs of the HBA socket, e.g. "0,1,2,3,4,5,6,7"
WIN_TEMPLATE="Windows Server 2025"            # exact name-label: xe template-list params=name-label | grep -i windows
WIN_ISO=""                                    # name of the Windows ISO in an ISO SR (optional)

# ---------------------------------------------------------------- SR and HA
SR_NAME="SR-DataCore"
HB_SR_NAME="SR-HA-Heartbeat"
HA_TIMEOUT=120                                # s; a lower value (XAPI default when HA is enabled from Xen Orchestra) causes fences
HB_MIN_FREE_GIB=4                             # free space required on the heartbeat SR at first enablement
ISCSI_TMO_MAX=30                              # s; alert if recovery_tmo is above (expected: 5)
SHUTDOWN_TIMEOUT=300                          # s before forced shutdown of a VM, and max wait for the other host (stop --ups)
