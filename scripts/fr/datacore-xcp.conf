# datacore-xcp.conf - variables du deploiement DataCore SANsymphony sur pool XCP-ng 8.3
# Syntaxe bash, chargee par datacore-xcp.sh (meme dossier, ou chemin dans $DATACORE_XCP_CONF).
# Fichier identique sur les 2 hotes : apres modification, './datacore-xcp.sh sync'.
# Ne pas retirer les 'declare -A' (tableaux associatifs).

# ---------------------------------------------------------------- Pool
HOSTS=([1]="xcp-01" [2]="xcp-02")             # name-label XAPI des hotes (xe host-list) ; noeud 1 = master a l'installation (peut changer apres une bascule HA)
DC_VMS=([1]="DC-01" [2]="DC-02")              # VM SANsymphony a creer

# ---------------------------------------------------------------- Reseau
# Carte physique (device XCP) par fonction : choisir avec './datacore-xcp.sh nics' (valeurs ci-dessous = exemple).
# 4 cartes distinctes, presentes sous le meme nom sur les 2 hotes, hors management.
declare -A NIC=([DC-FE1]=eth0 [DC-FE2]=eth1 [DC-MR1]=eth2 [DC-MR2]=eth3)
MGMT_NET="mgmt"                               # name-label du reseau de management du pool (xe network-list)
# Reseau du VIF de management des VM DataCore (VIF 0). Vide = MGMT_NET.
# Recommande : un reseau qui ne depend pas du seul lien de management des hotes (section 2).
DC_MGMT_NET=""
# 3 premiers octets de chaque reseau de stockage (/24, non route, sans passerelle)
declare -A SUBNET=([DC-FE1]=10.200.11 [DC-FE2]=10.200.12 [DC-MR1]=10.200.21 [DC-MR2]=10.200.22)
HOST_OCT=([1]=11 [2]=12)                      # dernier octet des dom0 sur FE1/FE2
DC_OCT=([1]=21 [2]=22)                        # dernier octet des VM DataCore sur FE et MR
MTU=9000                                      # MTU des 4 reseaux de stockage, identique de bout en bout

# ---------------------------------------------------------------- iSCSI
# IQN des dom0, proposes par 'host N' (la saisie peut les modifier). A fixer AVANT 'iscsi' et la DMC.
# Format : iqn.AAAA-MM.domaine.inverse[:nom], en minuscules.
# Proposition : HOST_IQN[N] s'il est renseigne, sinon IQN_PREFIX:nom-de-l-hote, sinon l'IQN actuel.
IQN_PREFIX=""                                 # ex. "iqn.2026-09.lan.exemple"
HOST_IQN=([1]="" [2]="")

# ---------------------------------------------------------------- NTP
NTP_SERVERS=()                                # OBLIGATOIRE, ex. ("ntp1.exemple.lan" "ntp2.exemple.lan") ; aligner sur l'emulateur PDC

# ---------------------------------------------------------------- Passthrough
# BDF du HBA SAS de chaque hote : 'lspci -nn | grep -iE "sas|raid"' sur CHAQUE hote
PCI_BDF=([1]="0000:00:00.0" [2]="0000:00:00.0")

# ---------------------------------------------------------------- VM DataCore
DC_VCPU=10                                    # DataCore : 4 + 3 par paire de ports iSCSI (FE, MR) = 10 ; +1 pour le performance recording
DC_RAM_GIB=32
DC_DISK_GIB=100
LOCAL_SR=([1]="" [2]="")                      # UUID du SR local portant la VM ; vide = detection auto
DC_VCPU_MASK=([1]="" [2]="")                  # optionnel : CPU du socket du HBA, ex. "0,1,2,3,4,5,6,7"
WIN_TEMPLATE="Windows Server 2025"            # name-label exact : xe template-list params=name-label | grep -i windows
WIN_ISO=""                                    # nom de l'ISO Windows dans un SR ISO (optionnel)

# ---------------------------------------------------------------- SR et HA
SR_NAME="SR-DataCore"
HB_SR_NAME="SR-HA-Heartbeat"
HA_TIMEOUT=120                                # s ; une valeur plus basse (defaut XAPI quand la HA est activee depuis Xen Orchestra) provoque des fences
HB_MIN_FREE_GIB=4                             # espace libre exige sur le SR heartbeat a la 1re activation
ISCSI_TMO_MAX=30                              # s ; alerte si recovery_tmo au-dela (attendu : 5)
SHUTDOWN_TIMEOUT=300                          # s avant arret force d'une VM, et attente max de l'autre hote (stop --ups)
